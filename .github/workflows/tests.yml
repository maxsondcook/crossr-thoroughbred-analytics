# Unit tests and the 17 no-peeking (leakage) tests. Neither needs the private database.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (tag in the comment) so a moved tag cannot change what runs.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-model.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-model.txt
      - name: Unit tests
        run: python -m pytest tests --ignore=tests/e2e -q
      - name: Leakage tests
        run: python -m pytest models_final/tests -q
